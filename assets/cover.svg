<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#101319"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb547" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffb547" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffb547" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pBuy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ee085"/>
      <stop offset="100%" stop-color="#2ee085" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pSell" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5c6c"/>
      <stop offset="100%" stop-color="#ff5c6c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#grid)"/>

  <!-- center hub -->
  <circle cx="640" cy="240" r="180" fill="url(#hub)"/>
  <circle cx="640" cy="240" r="6" fill="#ffb547"/>
  <circle cx="640" cy="240" r="18" fill="none" stroke="#ffb547" stroke-opacity="0.3" stroke-width="1"/>

  <!-- radiating particles: buys (green) -->
  <g>
    <circle cx="420" cy="180" r="20" fill="url(#pBuy)"/><circle cx="420" cy="180" r="4" fill="#2ee085"/>
    <circle cx="500" cy="320" r="15" fill="url(#pBuy)"/><circle cx="500" cy="320" r="3" fill="#2ee085"/>
    <circle cx="820" cy="150" r="25" fill="url(#pBuy)"/><circle cx="820" cy="150" r="5" fill="#2ee085"/>
    <circle cx="900" cy="290" r="18" fill="url(#pBuy)"/><circle cx="900" cy="290" r="4" fill="#2ee085"/>
    <circle cx="300" cy="240" r="14" fill="url(#pBuy)"/><circle cx="300" cy="240" r="3" fill="#2ee085"/>
    <circle cx="1000" cy="220" r="22" fill="url(#pBuy)"/><circle cx="1000" cy="220" r="4" fill="#2ee085"/>
    <circle cx="580" cy="120" r="12" fill="url(#pBuy)"/><circle cx="580" cy="120" r="3" fill="#2ee085"/>
    <circle cx="700" cy="380" r="16" fill="url(#pBuy)"/><circle cx="700" cy="380" r="4" fill="#2ee085"/>
    <circle cx="1080" cy="340" r="14" fill="url(#pBuy)"/><circle cx="1080" cy="340" r="3" fill="#2ee085"/>
    <circle cx="200" cy="340" r="12" fill="url(#pBuy)"/><circle cx="200" cy="340" r="3" fill="#2ee085"/>
  </g>
  <!-- sells (red) -->
  <g>
    <circle cx="750" cy="110" r="18" fill="url(#pSell)"/><circle cx="750" cy="110" r="4" fill="#ff5c6c"/>
    <circle cx="450" cy="380" r="14" fill="url(#pSell)"/><circle cx="450" cy="380" r="3" fill="#ff5c6c"/>
    <circle cx="960" cy="380" r="16" fill="url(#pSell)"/><circle cx="960" cy="380" r="4" fill="#ff5c6c"/>
    <circle cx="360" cy="120" r="15" fill="url(#pSell)"/><circle cx="360" cy="120" r="3" fill="#ff5c6c"/>
    <circle cx="1120" cy="140" r="12" fill="url(#pSell)"/><circle cx="1120" cy="140" r="3" fill="#ff5c6c"/>
    <circle cx="160" cy="180" r="14" fill="url(#pSell)"/><circle cx="160" cy="180" r="3" fill="#ff5c6c"/>
  </g>

  <!-- wordmark -->
  <text x="640" y="256" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="800" font-size="160" fill="#e6ebf2" letter-spacing="18">FLUX</text>

  <!-- tagline -->
  <text x="640" y="310" text-anchor="middle"
    font-family="ui-monospace, 'SF Mono', Menlo, monospace"
    font-size="16" fill="#7a8493" letter-spacing="6">SOLANA TRADE SWARM · REAL-TIME VISUALIZER</text>

  <!-- corner tags -->
  <text x="40" y="50" font-family="ui-monospace, monospace" font-size="12" fill="#4a525e" letter-spacing="2">SIGNAL / 001</text>
  <text x="1240" y="50" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#4a525e" letter-spacing="2">v1.0 · MIT</text>
  <!-- bottom legend swatches -->
  <circle cx="46" cy="446" r="4" fill="#2ee085"/>
  <text x="58" y="450" font-family="ui-monospace, monospace" font-size="11" fill="#7a8493" letter-spacing="1">BUY</text>
  <circle cx="110" cy="446" r="4" fill="#ff5c6c"/>
  <text x="122" y="450" font-family="ui-monospace, monospace" font-size="11" fill="#7a8493" letter-spacing="1">SELL</text>
  <circle cx="180" cy="446" r="4" fill="#ffb547"/>
  <text x="192" y="450" font-family="ui-monospace, monospace" font-size="11" fill="#7a8493" letter-spacing="1">HUB</text>
  <text x="1240" y="450" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#4a525e" letter-spacing="1">node.js · solana · helius</text>
</svg>
